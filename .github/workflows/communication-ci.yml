name: communication-ci
on:
  push:
    branches: ["main", "master"]
  pull_request:
permissions:
  contents: read
jobs:
  validate-communication:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check "ruff==0.6.9" "mypy==1.11.2" "bandit==1.7.9"

      - name: Lint implementation
        run: ruff check --select E9,F src tests

      - name: Type-check implementation
        run: mypy src --ignore-missing-imports

      - name: Static security analysis
        run: bandit --quiet --recursive src

      - name: Compile implementation
        run: python -m compileall -q src tests
      - name: Run communication tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -t . -v
      - name: Validate migration syntax
        run: |
          python - <<'PY'
          import pathlib
          migration = pathlib.Path("migrations/001_communication.sql").read_text()
          required = ("CREATE TABLE", "communication_conversations",
                      "communication_messages", "communication_calls")
          missing = [item for item in required if item not in migration]
          if missing:
              raise SystemExit(f"migration missing required contract: {missing}")
          PY
      - name: Security checks
        run: |
          ! grep -RInE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----' \
            --exclude-dir=.git .
          if find . -type f \( -name '.env' -o -name '*.pem' \) | grep -q .; then
            echo "secret-bearing file found"
            exit 1
          fi
      - name: Build container
        run: docker build --tag communication-ci .

